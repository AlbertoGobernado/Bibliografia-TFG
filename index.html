<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliografía — TFG</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --ink: #1a1814;
    --ink-muted: #6b6760;
    --ink-faint: #c2bfb8;
    --accent: #b85c2e;
    --accent-light: #f0e8e2;
    --border: #e4e0d8;
    --radius: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  header {
    background: var(--ink);
    color: #f7f5f0;
    padding: 36px 24px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 20px,
      rgba(255,255,255,0.015) 20px,
      rgba(255,255,255,0.015) 21px
    );
  }

  .header-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    margin-bottom: 10px;
    position: relative;
  }

  header h1 {
    font-family: 'EB Garamond', serif;
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 400;
    line-height: 1.3;
    position: relative;
    color: #f7f5f0;
  }

  header p {
    margin-top: 8px;
    font-size: 13px;
    color: #9e9b94;
    position: relative;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 20px 0 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-label {
    font-size: 12px;
    color: var(--ink-muted);
    font-weight: 500;
    margin-right: 4px;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    color: var(--ink-muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .count-badge {
    font-size: 12px;
    color: var(--ink-muted);
    margin-left: auto;
    white-space: nowrap;
  }

  .ref-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
  }

  .ref-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    transition: box-shadow 0.15s;
  }

  .ref-card:hover {
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .ref-num {
    font-family: 'EB Garamond', serif;
    font-size: 17px;
    color: var(--accent);
    min-width: 28px;
    font-weight: 500;
    padding-top: 1px;
    user-select: none;
  }

  .ref-body { flex: 1; min-width: 0; }

  .ref-authors {
    font-size: 13px;
    color: var(--ink-muted);
    font-style: italic;
    font-family: 'EB Garamond', serif;
    line-height: 1.4;
    margin-bottom: 3px;
  }

  .ref-title {
    font-size: 14.5px;
    color: var(--ink);
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .ref-source {
    font-size: 12.5px;
    color: var(--ink-muted);
    line-height: 1.4;
  }

  .ref-doi {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 7px;
    font-size: 11.5px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    border: 1px solid var(--accent-light);
    background: var(--accent-light);
    padding: 3px 9px;
    border-radius: 20px;
    transition: background 0.15s;
  }

  .ref-doi:hover {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .ref-url {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 7px;
    font-size: 11.5px;
    color: #4a7c8e;
    text-decoration: none;
    font-weight: 500;
    border: 1px solid #daeaf0;
    background: #f0f7fa;
    padding: 3px 9px;
    border-radius: 20px;
    transition: background 0.15s;
  }

  .ref-url:hover {
    background: #4a7c8e;
    color: white;
    border-color: #4a7c8e;
  }

  .tag {
    display: inline-block;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 500;
    margin-bottom: 5px;
  }

  .tag-cade { background: #e8f0fe; color: #2c5fad; }
  .tag-cadx { background: #e6f4ea; color: #1e6b3a; }
  .tag-epidemiology { background: #fef3e2; color: #9a5000; }
  .tag-methodology { background: #f3e8fd; color: #6a1fa8; }
  .tag-guideline { background: #fce8ec; color: #9b2335; }
  .tag-general { background: var(--bg); color: var(--ink-muted); }

  .hidden { display: none !important; }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: var(--ink-faint);
  }
</style>
</head>
<body>

<header>
  <div class="header-label">Trabajo de Fin de Grado · Medicina</div>
  <h1>Bibliografía</h1>
  <p>Inteligencia artificial en colonoscopia: sistemas CADe y CADx</p>
</header>

<div class="container">
  <div class="filter-bar">
    <span class="filter-label">Filtrar:</span>
    <button class="filter-btn active" onclick="filterRefs('all', this)">Todas</button>
    <button class="filter-btn" onclick="filterRefs('epidemiology', this)">Epidemiología</button>
    <button class="filter-btn" onclick="filterRefs('cade', this)">CADe</button>
    <button class="filter-btn" onclick="filterRefs('cadx', this)">CADx</button>
    <button class="filter-btn" onclick="filterRefs('guideline', this)">Guías clínicas</button>
    <button class="filter-btn" onclick="filterRefs('methodology', this)">Metodología</button>
    <span class="count-badge" id="count-badge">40 referencias</span>
  </div>

  <div class="ref-list" id="ref-list"></div>

  <footer>
    Referencias formateadas según el estilo Vancouver · <span id="year"></span>
  </footer>
</div>

  { n:33, tag:'methodology', authors:'Ouzzani M, Hammady H, Fedorowicz Z, Elmagarmid A.', title:'Rayyan—a web and mobile app for systematic reviews.', source:'Syst Rev. 2016;5(1):210.', doi:'10.1186/s13643-016-0384-4' },

  { n:39, tag:'cadx', authors:'Sato K, Kuramochi M, Tsuchiya A, et al.', title:'Multicentre study to assess the performance of an artificial intelligence instrument to support qualitative diagnosis of colorectal polyps.', source:'BMJ Open Gastroenterol. 2024;11(1).', doi:'10.1136/bmjgast-2024-001553' },

];

const tagLabels = {
  cade: 'CADe', cadx: 'CADx', epidemiology: 'Epidemiología',
  methodology: 'Metodología', guideline: 'Guía clínica', general: 'General'
};

function renderRefs(data) {
  const list = document.getElementById('ref-list');
  list.innerHTML = '';
  data.forEach(r => {
    const card = document.createElement('div');
    card.className = 'ref-card';
    card.dataset.tag = r.tag;
    const link = r.doi
      ? `<a class="ref-doi" href="https://doi.org/${r.doi}" target="_blank">↗ DOI</a>`
      : r.url ? `<a class="ref-url" href="${r.url}" target="_blank">↗ Enlace</a>` : '';
    card.innerHTML = `
      <div class="ref-num">${r.n}.</div>
      <div class="ref-body">
        <span class="tag tag-${r.tag}">${tagLabels[r.tag]}</span>
        <div class="ref-authors">${r.authors}</div>
        <div class="ref-title">${r.title}</div>
        <div class="ref-source">${r.source}</div>
        ${link}
      </div>`;
    list.appendChild(card);
  });
  document.getElementById('count-badge').textContent = data.length + ' referencias';
}

function filterRefs(tag, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = tag === 'all' ? refs : refs.filter(r => r.tag === tag);
  renderRefs(filtered);
}

document.getElementById('year').textContent = new Date().getFullYear();
renderRefs(refs);
</script>
</body>
</html>
